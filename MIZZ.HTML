<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShakedMIZ</title>
    
    <!-- גופנים מגוגל -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;900&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- אייקונים -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-black: #050505;
            --card-bg: rgba(16, 16, 18, 0.92);
            --red-main: #ff1e1e;
            --red-dark: #8f0000;
            --red-glow: rgba(255, 30, 30, 0.45);
            --text-main: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-black);
            background-image: 
                linear-gradient(rgba(255, 30, 30, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 30, 30, 0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* תאורת ניאון אדומה ברקע */
        .bg-glow {
            position: fixed;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.3;
            animation: float 7s ease-in-out infinite alternate;
        }

        .glow-1 {
            top: -150px;
            right: -100px;
            background: var(--red-main);
        }

        .glow-2 {
            bottom: -150px;
            left: -100px;
            background: var(--red-dark);
            animation-delay: -3.5s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(35px) scale(1.15); }
        }

        /* קונטיינר ראשי */
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(10, 10, 12, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 30, 30, 0.22);
            border-radius: 28px;
            padding: 38px 25px 32px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(255, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* פס אדום זוהר בראש הכרטיס */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red-main), transparent);
            box-shadow: 0 0 15px var(--red-main);
            z-index: 3;
        }

        /* השתקפות עדינה של תמונת הערוץ ברקע העליון */
        .ambient-banner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
            filter: blur(35px) brightness(0.35);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 0;
            pointer-events: none;
        }

        .ambient-banner.visible {
            opacity: 0.55;
        }

        header, main, footer {
            position: relative;
            z-index: 2;
        }

        /* אזור תמונת הערוץ (מותאם אוטומטית ללוגו מרובע או לבאנר רחב) */
        .image-wrapper {
            width: 145px;
            height: 145px;
            margin: 0 auto 20px;
            border-radius: 24px;
            border: 2.5px solid var(--red-main);
            box-shadow: 0 0 30px var(--red-glow);
            overflow: hidden;
            background: #111114;
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        /* אם התמונה רחבה (באנר), המסגרת מתאימה את עצמה אוטומטית */
        .image-wrapper.is-banner {
            width: 100%;
            height: auto;
            max-height: 210px;
            border-radius: 18px;
        }

        .image-wrapper:hover {
            transform: scale(1.03);
            box-shadow: 0 0 42px rgba(255, 30, 30, 0.75);
        }

        /* אפקט טעינה עד שהתמונה עולה */
        .image-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #111 25%, #220808 50%, #111 75%);
            background-size: 200% 100%;
            animation: loadingPulse 1.5s infinite;
            transition: opacity 0.4s ease;
        }

        .image-wrapper.loaded::after {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes loadingPulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .channel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .image-wrapper.is-banner .channel-img {
            height: auto;
            max-height: 210px;
        }

        .image-wrapper.loaded .channel-img {
            opacity: 1;
        }

        /* שם הערוץ */
        .creator-name {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-bottom: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .creator-name span {
            color: var(--red-main);
            text-shadow: 0 0 18px rgba(255, 30, 30, 0.55);
        }

        .verified-icon {
            color: var(--red-main);
            font-size: 21px;
            filter: drop-shadow(0 0 6px rgba(255, 30, 30, 0.5));
        }

        /* רשימת הקישורים הנקייה */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            background: rgba(255, 30, 30, 0.1);
            color: var(--red-main);
            border: 1px solid rgba(255, 30, 30, 0.22);
            transition: all 0.3s ease;
        }

        .link-title {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.2px;
        }

        .arrow-icon {
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 2;
        }

        /* אפקט מעבר עכבר בשחור-אדום */
        .link-card:hover {
            transform: translateY(-4px);
            border-color: var(--red-main);
            box-shadow: 0 10px 25px -5px rgba(255, 30, 30, 0.32);
            background: linear-gradient(90deg, rgba(255, 30, 30, 0.14) 0%, rgba(16, 16, 18, 0.96) 100%);
        }

        .link-card:hover .icon-box {
            background: var(--red-main);
            color: #ffffff;
            transform: scale(1.08) rotate(-4deg);
            box-shadow: 0 0 18px var(--red-glow);
        }

        .link-card:hover .arrow-icon {
            transform: translateX(-5px);
            color: var(--red-main);
        }

        /* הדגשה לכפתור Kick הראשי */
        .primary-card {
            border-color: rgba(255, 30, 30, 0.45);
            background: linear-gradient(90deg, rgba(255, 30, 30, 0.16) 0%, rgba(20, 10, 10, 0.95) 100%);
            box-shadow: 0 6px 20px -5px rgba(255, 30, 30, 0.2);
        }

        .primary-card .icon-box {
            background: var(--red-main);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 30, 30, 0.4);
        }

        .primary-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 30, 30, 0.25), transparent);
            transform: skewX(-25deg);
            animation: shine 3.5s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            25% { left: 200%; }
            100% { left: 200%; }
        }

        /* פוטר */
        footer {
            margin-top: 32px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
        }

        footer strong {
            color: var(--red-main);
        }

        @media (max-width: 400px) {
            .container {
                padding: 32px 18px 26px;
            }
            .link-card {
                padding: 14px 16px;
            }
            .link-title {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <!-- תאורת ניאון ברקע -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="container">
        <!-- השתקפות רקע מהתמונה שלך -->
        <div id="ambientBanner" class="ambient-banner"></div>

        <!-- תמונת הערוץ + השם בלבד -->
        <header>
            <div id="imageWrapper" class="image-wrapper">
                <img id="channelImg" 
                     src="https://api.microlink.io/?url=https://ibb.co/Ngh4TyvF&embed=image.url" 
                     alt="ShakedMIZ" 
                     class="channel-img">
            </div>

            <h1 class="creator-name">
                <i class="fa-solid fa-circle-check verified-icon"></i>
                <div>Shaked<span>MIZ</span></div>
            </h1>
        </header>

        <!-- כפתורים נקיים בלי תיאורים מתחת -->
        <main class="links-list">
            
            <!-- קישור ל-Kick -->
            <a href="https://kick.com/shakedmiz" target="_blank" rel="noopener noreferrer" class="link-card primary-card">
                <div class="link-content">
                    <div class="icon-box">
                        <svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 3h5.4v6h2.4V6.6h2.4V4.2h2.4V3H21v5.4h-2.4v2.4h-2.4v2.4h2.4v2.4H21V21h-5.4v-1.2h-2.4v-2.4h-2.4V15H8.4v6H3V3z"/>
                        </svg>
                    </div>
                    <span class="link-title">Kick</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- קישור לדיסקורד -->
            <a href="https://discord.gg/qB73yKxU" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-discord"></i>
                    </div>
                    <span class="link-title">שרת הדיסקורד</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

            <!-- קישור לתרומות פייפאל -->
            <a href="https://botrix.live/k/shakedmiz/tip" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-paypal"></i>
                    </div>
                    <span class="link-title">תרומות (PayPal)</span>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </a>

        </main>

        <footer>
            <p>© <strong>ShakedMIZ</strong></p>
        </footer>
    </div>

    <!-- טעינה אוטומטית וחכמה של התמונה מתוך הקישור https://ibb.co/Ngh4TyvF -->
    <script>
        (function() {
            const ibbPage = 'https://ibb.co/Ngh4TyvF';
            const cacheKey = 'shakedmiz_img_Ngh4TyvF';
            const img = document.getElementById('channelImg');
            const wrapper = document.getElementById('imageWrapper');
            const ambient = document.getElementById('ambientBanner');

            function onImageReady() {
                if (img.naturalWidth && img.naturalHeight) {
                    const ratio = img.naturalWidth / img.naturalHeight;
                    if (ratio > 1.3) {
                        wrapper.classList.add('is-banner');
                    }
                }
                wrapper.classList.add('loaded');
                ambient.style.backgroundImage = `url("${img.src}")`;
                ambient.classList.add('visible');
            }

            img.addEventListener('load', onImageReady);

            // בדיקה אם הקישור הישיר כבר שמור בזיכרון לטעינה מיידית
            try {
                const cached = localStorage.getItem(cacheKey);
                if (cached) {
                    img.src = cached;
                }
            } catch (e) {}

            // שליפת הקישור הישיר המדויק מ-ImgBB וגיבוי אוטומטי
            async function resolveDirectImage() {
                try {
                    const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(ibbPage));
                    const json = await res.json();
                    if (json && json.data && json.data.image && json.data.image.url) {
                        applyResolvedUrl(json.data.image.url);
                        return;
                    }
                } catch (e) {}

                try {
                    const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(ibbPage));
                    const json = await res.json();
                    const match = json.contents && json.contents.match(/https:\/\/i\.ibb\.co\/[^"'\s<>]+/);
                    if (match && match[0]) {
                        applyResolvedUrl(match[0]);
                    }
                } catch (e) {}
            }

            function applyResolvedUrl(url) {
                try { localStorage.setItem(cacheKey, url); } catch (e) {}
                if (!wrapper.classList.contains('loaded') || img.src.includes('microlink')) {
                    img.src = url;
                }
            }

            img.addEventListener('error', function() {
                img.src = 'https://ui-avatars.com/api/?name=SM&background=0d0d0d&color=ff1e1e&size=300&font-size=0.45&bold=true';
            }, { once: true });

            resolveDirectImage();
        })();
    </script>
</body>
</html>
